<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile Work Slider Preview</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
    }
    .device-title {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .phone-mockup {
      width: 390px;
      height: 750px;
      border: 8px solid #1e293b;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.1);
      background: #070e1b;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #070e1b;
    }
  </style>
</head>
<body>
  <div class="device-title">iPhone 14 / Mobile Viewport (390px) — Work Section Slider</div>
  <div class="phone-mockup">
    <iframe src="index.html#work" id="mobile-frame"></iframe>
  </div>
</body>
</html>
