<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  body {
    background: #FAF9F5;
    margin: 0;
    padding: 60px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .stage {
    position: relative;
    width: 680px;
    height: 560px;
  }
  
  /* Ambient Animated Glow */
  .hero-ambient-glow {
    position: absolute;
    inset: -5% -5% 0% -5%;
    background: radial-gradient(circle at 55% 45%, rgba(37, 99, 235, 0.20), rgba(6, 182, 212, 0.14) 40%, rgba(99, 102, 241, 0.08) 60%, transparent 75%);
    filter: blur(55px);
    z-index: 1;
    pointer-events: none;
    animation: pulseAmbient 7s ease-in-out infinite alternate;
  }
  @keyframes pulseAmbient {
    0% { transform: scale(0.94); opacity: 0.7; }
    100% { transform: scale(1.06) translate(-10px, 10px); opacity: 1; }
  }

  /* Main SVG Graphic */
  .hero-svg-art {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 5;
    display: block;
    filter: drop-shadow(0 25px 45px rgba(13, 25, 45, 0.08));
  }

  /* Floating Glass HUD Badges */
  .hud-badge-talent {
    position: absolute;
    top: 25px;
    right: 5px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.09), 0 2px 6px rgba(15, 23, 42, 0.04);
    padding: 0.8rem 1.15rem;
    border-radius: 16px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    animation: floatHudTop 6s ease-in-out infinite alternate;
  }
  @keyframes floatHudTop {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }

  .hud-header {
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .hud-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2563eb;
  }
  .hud-status {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
  }
  .pulse-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: livePulse 2s infinite;
  }
  @keyframes livePulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .hud-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: #0f172a;
  }
  .hud-pills {
    display: flex;
    gap: 0.35rem;
  }
  .hud-pill {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    background: #f1f5f9;
    color: #475569;
  }
  .hud-pill.active {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .hud-badge-match {
    position: absolute;
    bottom: 35px;
    left: 10px;
    background: #0d192d;
    color: #ffffff;
    box-shadow: 0 18px 40px rgba(13, 25, 45, 0.28);
    padding: 0.75rem 1.3rem;
    border-radius: 9999px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    border: 1px solid rgba(255, 255, 255, 0.14);
    animation: floatHudBottom 7s ease-in-out infinite alternate 1s;
  }
  @keyframes floatHudBottom {
    0% { transform: translateY(0); }
    100% { transform: translateY(8px); }
  }
  .match-icon-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #38bdf8;
  }
  .match-val {
    font-size: 1.15rem;
    font-weight: 800;
    color: #38bdf8;
    line-height: 1;
  }
  .match-text {
    font-size: 0.72rem;
    font-weight: 500;
    color: #cbd5e1;
    margin-top: 2px;
  }

  .hud-badge-speed {
    position: absolute;
    top: 50%;
    left: -15px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    padding: 0.6rem 1rem;
    border-radius: 12px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    animation: floatHudMid 5.5s ease-in-out infinite alternate 0.5s;
  }
  @keyframes floatHudMid {
    0% { transform: translateY(0); }
    100% { transform: translateY(-6px); }
  }
  .speed-val {
    font-size: 0.95rem;
    font-weight: 800;
    color: #2563eb;
  }
  .speed-desc {
    font-size: 0.7rem;
    font-weight: 600;
    color: #334155;
    line-height: 1.2;
  }
</style>
</head>
<body>

  <div class='stage'>
    <div class='hero-ambient-glow'></div>

    <!-- Themed SVG Vector Composition: Nexora Geometric Facets & Digital Transformation Matrix -->
    <svg class='hero-svg-art' viewBox='0 0 680 560' fill='none' xmlns='http://www.w3.org/2000/svg'>
      <defs>
        <!-- Gradients for Logo-Inspired Facets -->
        <linearGradient id='facetLeft' x1='120' y1='80' x2='260' y2='420' gradientUnits='userSpaceOnUse'>
          <stop stop-color='#1d4ed8'/>
          <stop offset='0.55' stop-color='#2563eb'/>
          <stop offset='1' stop-color='#1e3a8a'/>
        </linearGradient>

        <linearGradient id='facetCenter' x1='200' y1='40' x2='480' y2='440' gradientUnits='userSpaceOnUse'>
          <stop stop-color='#38bdf8'/>
          <stop offset='0.45' stop-color='#2563eb'/>
          <stop offset='1' stop-color='#0f172a'/>
        </linearGradient>

        <linearGradient id='facetRight' x1='380' y1='100' x2='520' y2='450' gradientUnits='userSpaceOnUse'>
          <stop stop-color='#0f172a'/>
          <stop offset='0.6' stop-color='#1e293b'/>
          <stop offset='1' stop-color='#334155'/>
        </linearGradient>

        <linearGradient id='facetGlass' x1='150' y1='90' x2='440' y2='380' gradientUnits='userSpaceOnUse'>
          <stop stop-color='#ffffff' stop-opacity='0.65'/>
          <stop offset='0.4' stop-color='#93c5fd' stop-opacity='0.25'/>
          <stop offset='1' stop-color='#38bdf8' stop-opacity='0.08'/>
        </linearGradient>

        <linearGradient id='wireGrad' x1='0' y1='0' x2='680' y2='560' gradientUnits='userSpaceOnUse'>
          <stop stop-color='#2563eb' stop-opacity='0.7'/>
          <stop offset='0.5' stop-color='#38bdf8' stop-opacity='0.5'/>
          <stop offset='1' stop-color='#818cf8' stop-opacity='0.2'/>
        </linearGradient>

        <!-- Dynamic Glow Filter -->
        <filter id='coreGlow' x='-20%' y='-20%' width='140%' height='140%'>
          <feGaussianBlur stdDeviation='8' result='blur'/>
          <feComposite in='SourceGraphic' in2='blur' operator='over'/>
        </filter>
      </defs>

      <!-- 1. Background Transformation Radar Grid & Isometric Coordinates -->
      <g opacity='0.55'>
        <!-- Transformation concentric radar arcs -->
        <circle cx='340' cy='270' r='240' stroke='url(#wireGrad)' stroke-width='1' stroke-dasharray='4 8' opacity='0.4'/>
        <circle cx='340' cy='270' r='185' stroke='#38bdf8' stroke-width='1.2' stroke-dasharray='6 10' opacity='0.35'>
          <animateTransform attributeName='transform' type='rotate' from='0 340 270' to='360 340 270' dur='40s' repeatCount='indefinite'/>
        </circle>
        <circle cx='340' cy='270' r='125' stroke='#2563eb' stroke-width='1.5' stroke-dasharray='10 14' opacity='0.4'>
          <animateTransform attributeName='transform' type='rotate' from='360 340 270' to='0 340 270' dur='30s' repeatCount='indefinite'/>
        </circle>
      </g>

      <!-- 2. Isometric Grid Network Lines & Pulsing Data Packets -->
      <g stroke='#94a3b8' stroke-width='1' opacity='0.35' stroke-dasharray='3 6'>
        <line x1='120' y1='480' x2='340' y2='270'/>
        <line x1='560' y1='480' x2='340' y2='270'/>
        <line x1='340' y1='50' x2='340' y2='270'/>
        <line x1='70' y1='210' x2='220' y2='270'/>
        <line x1='600' y1='210' x2='460' y2='270'/>
      </g>

      <!-- Pulsing Data Transmission Signals -->
      <circle cx='340' cy='120' r='3.5' fill='#38bdf8' filter='url(#coreGlow)'>
        <animate attributeName='cy' values='50; 270; 50' dur='4s' repeatCount='indefinite'/>
        <animate attributeName='opacity' values='0.2; 1; 0.2' dur='4s' repeatCount='indefinite'/>
      </circle>
      <circle cx='230' cy='375' r='3.5' fill='#2563eb' filter='url(#coreGlow)'>
        <animate attributeName='cx' values='120; 340; 120' dur='5s' repeatCount='indefinite'/>
        <animate attributeName='cy' values='480; 270; 480' dur='5s' repeatCount='indefinite'/>
        <animate attributeName='opacity' values='0.2; 1; 0.2' dur='5s' repeatCount='indefinite'/>
      </circle>
      <circle cx='450' cy='375' r='3.5' fill='#06b6d4' filter='url(#coreGlow)'>
        <animate attributeName='cx' values='560; 340; 560' dur='6s' repeatCount='indefinite'/>
        <animate attributeName='cy' values='480; 270; 480' dur='6s' repeatCount='indefinite'/>
        <animate attributeName='opacity' values='0.3; 1; 0.3' dur='6s' repeatCount='indefinite'/>
      </circle>

      <!-- 3. Primary Centerpiece: The Dimensional Nexora Geometric Monolith -->
      <g>
        <animateTransform attributeName='transform' type='translate' values='0 0; 0 -12; 0 0' dur='6s' repeatCount='indefinite' ease='ease-in-out'/>

        <!-- Isometric Base Shadow Platform -->
        <ellipse cx='340' cy='465' rx='190' ry='48' fill='url(#wireGrad)' opacity='0.12' filter='url(#coreGlow)'/>

        <!-- Secondary Floating Glass Back-Planes -->
        <polygon points='230,120 405,65 450,215 275,270' fill='url(#facetGlass)' stroke='rgba(255,255,255,0.7)' stroke-width='1.5' opacity='0.85'/>

        <!-- Core Nexora Logo-Inspired Geometric Facets (Angled, Faceted, Dimensional 'N') -->
        
        <!-- Left Facet Pillar -->
        <g id='logo-left-pillar'>
          <polygon points='175,170 235,210 235,400 175,360' fill='url(#facetLeft)'/>
          <polygon points='175,170 235,210 258,182 198,142' fill='#60a5fa'/>
          <polygon points='235,210 258,182 258,372 235,400' fill='#1e3a8a' opacity='0.9'/>
        </g>

        <!-- Center Crossbeam Facet (Angled 45-deg connecting beam) -->
        <g id='logo-diagonal-beam'>
          <polygon points='198,90 470,350 518,350 248,90' fill='url(#facetCenter)' filter='url(#coreGlow)' opacity='0.95'/>
          <polygon points='198,90 248,90 270,62 220,62' fill='#bae6fd'/>
          <polygon points='470,350 518,350 495,378 448,378' fill='#0284c7' opacity='0.85'/>
        </g>

        <!-- Right Facet Pillar -->
        <g id='logo-right-pillar'>
          <polygon points='435,105 495,145 495,335 435,295' fill='url(#facetRight)'/>
          <polygon points='435,105 495,145 518,118 458,78' fill='#64748b'/>
          <polygon points='495,145 518,118 518,308 495,335' fill='#090d16'/>
        </g>

        <!-- Glowing Digital Edge Highlights -->
        <polyline points='198,142 258,182 258,372' stroke='#93c5fd' stroke-width='2' stroke-linecap='round' opacity='0.85'/>
        <polyline points='220,62 270,62 518,310' stroke='#38bdf8' stroke-width='2.5' stroke-linecap='round' filter='url(#coreGlow)' opacity='0.95'/>
        <polyline points='458,78 518,118 518,308' stroke='#94a3b8' stroke-width='1.5' stroke-linecap='round' opacity='0.6'/>

        <!-- Floating Interactive Micro-Nodes -->
        <g filter='url(#coreGlow)'>
          <!-- Node 1: AI/ML Core -->
          <circle cx='198' cy='82' r='7' fill='#2563eb' stroke='#ffffff' stroke-width='2'/>
          <circle cx='198' cy='82' r='14' stroke='#38bdf8' stroke-width='1' stroke-dasharray='2 4'>
            <animate attributeName='r' values='10; 18; 10' dur='3s' repeatCount='indefinite'/>
          </circle>

          <!-- Node 2: Cloud Nexus -->
          <circle cx='505' cy='340' r='7' fill='#06b6d4' stroke='#ffffff' stroke-width='2'/>
          <circle cx='505' cy='340' r='14' stroke='#06b6d4' stroke-width='1' stroke-dasharray='2 4'>
            <animate attributeName='r' values='18; 10; 18' dur='3s' repeatCount='indefinite'/>
          </circle>

          <!-- Node 3: Top Apex (Header Overlap Area) -->
          <circle cx='340' cy='48' r='6' fill='#38bdf8' stroke='#ffffff' stroke-width='2'/>
        </g>

        <!-- Tech Skill Tags attached to nodes (re-positioned so no overlaps occur) -->
        <g font-family='sans-serif' font-size='10' font-weight='700' letter-spacing='0.04em'>
          <rect x='105' y='65' width='70' height='22' rx='6' fill='white' stroke='#e2e8f0' filter='drop-shadow(0 4px 10px rgba(0,0,0,0.06))'/>
          <text x='140' y='80' text-anchor='middle' fill='#2563eb'>✦ AI / ML</text>

          <rect x='525' y='330' width='74' height='22' rx='6' fill='white' stroke='#e2e8f0' filter='drop-shadow(0 4px 10px rgba(0,0,0,0.06))'/>
          <text x='562' y='345' text-anchor='middle' fill='#0284c7'>✦ CLOUD</text>

          <rect x='300' y='18' width='80' height='22' rx='6' fill='#0f172a' filter='drop-shadow(0 4px 12px rgba(15,23,42,0.18))'/>
          <text x='340' y='33' text-anchor='middle' fill='#38bdf8'>✦ GEN AI</text>
        </g>
      </g>
    </svg>

    <!-- Floating Glass HUD Badge 1: Top Right (IT Staffing Pool) -->
    <div class='hud-badge-talent'>
      <div class='hud-header'>
        <div class='hud-icon'>
          <svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
            <path d='M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'></path>
            <circle cx='9' cy='7' r='4'></circle>
            <path d='M23 21v-2a4 4 0 0 0-3-3.87'></path>
            <path d='M16 3.13a4 4 0 0 1 0 7.75'></path>
          </svg>
        </div>
        <div>
          <div class='hud-status'>
            <span class='pulse-live'></span>
            <span>Talent Network</span>
          </div>
          <div class='hud-title'>4,500+ Vetted Engineers</div>
        </div>
      </div>
      <div class='hud-pills'>
        <span class='hud-pill active'>Top 1% Talent</span>
        <span class='hud-pill'>AI-Assessed</span>
      </div>
    </div>

    <!-- Floating Glass HUD Badge 2: Mid-Left (Speed) -->
    <div class='hud-badge-speed'>
      <div class='speed-val'>3x</div>
      <div class='speed-desc'>Faster Hiring<br>&amp; Deployment</div>
    </div>

    <!-- Floating Glass HUD Badge 3: Bottom Left (Match Rate) -->
    <div class='hud-badge-match'>
      <div class='match-icon-circle'>
        <svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'>
          <polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'></polygon>
        </svg>
      </div>
      <div>
        <div class='match-val'>98.4%</div>
        <div class='match-text'>Staffing Match Accuracy</div>
      </div>
    </div>
  </div>

</body>
</html>
